# Single entry point: SPA static, /api/* → Go, /files/* → shared volume.
# Mounted as /etc/nginx/conf.d/default.conf.

server {
  listen 80;
  server_name _;

  # Body limit for uploads. Go enforces MAX_UPLOAD_MB on the file itself;
  # nginx allows ~1 MB on top for multipart boundaries/headers, so a file of
  # exactly 200 MB is not rejected here (double protection, single source of truth).
  client_max_body_size 201m;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;

  # Uniform JSON error even when nginx rejects the body itself.
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":"file exceeds 200 MB","code":"FILE_TOO_LARGE"}';
  }

  # --- React SPA ---
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
  # Hashed build assets can be cached forever.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # --- API ---
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Stream uploads to Go as they arrive instead of spooling 200 MB to
    # nginx's temp dir first: Go writes to the volume while the client uploads.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # --- Results: served straight from the shared volume (sendfile, Range) ---
  # Only finished files are reachable: uploads, .part files and directory
  # listings are never exposed.
  location ~ "^/files/(processed/[0-9a-f-]{36}\.mp4)$" {
    alias /data/$1;
    types { video/mp4 mp4; }
    default_type video/mp4;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
  }
  location /files/ {
    return 404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
