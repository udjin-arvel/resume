services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      # Dev image: default superuser, no SQL GRANT init (avoids init failures on system.*).
      CLICKHOUSE_DB: demo
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PG_DSN: postgres://demo:demo@postgres:5432/demo?sslmode=disable
      MYSQL_DSN: demo:demo@tcp(mysql:3306)/demo?parseTime=true&loc=UTC
      SQLITE_PATH: /data/sqlite.db
      CLICKHOUSE_DSN: clickhouse://default@clickhouse:9000/demo
      LISTEN: ":8080"
    volumes:
      - "./data:/data"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
