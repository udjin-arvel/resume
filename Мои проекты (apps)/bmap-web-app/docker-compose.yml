services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j}
    volumes:
      - neo4j_data:/data
    # Bolt/HTTP только внутри сети compose (bolt://neo4j:7687). На хост не публикуем:
    # 7474 и 7687 заняты слишком часто и снаружи не нужны.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      SQLITE_PATH: /data/app.db
    volumes:
      - api_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    # 8000 остаётся портом процесса внутри контейнера. На хосте — только localhost.
    ports:
      - "127.0.0.1:${API_PORT:-18400}:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    # nginx контейнера слушает 80. Снаружи — localhost, чтобы vhost на :443 был единственным входом.
    ports:
      - "127.0.0.1:${WEB_PORT:-18480}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  api_data:
