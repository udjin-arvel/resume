# Хостовый vhost. Скопировать на VPS:
#   /etc/nginx/sites-available/bmap.arvelov.space.conf
#   ln -sfn /etc/nginx/sites-available/bmap.arvelov.space.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# UI и /api отдаёт контейнер web (docker compose, 127.0.0.1:18480).
# Статический root /opt/bmap/dist больше не используется.

map $http_upgrade $bmap_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name bmap.arvelov.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bmap.arvelov.space;

    ssl_certificate     /etc/letsencrypt/live/thebook.arvelov.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebook.arvelov.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:18480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bmap_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
