worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Контейнер стоит за host-nginx (TLS на :443). Схему берём у него, иначе
  # WebSocket и редиректы видят http.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream nitro_app {
    server 127.0.0.1:3000;
  }

  # Порт API внутри сети compose, не путать с API_PORT на хосте.
  upstream bmap_api {
    server api:8000;
  }

  server {
    listen 80;
    client_max_body_size 4m;

    location /api/ {
      proxy_pass http://bmap_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://nitro_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
