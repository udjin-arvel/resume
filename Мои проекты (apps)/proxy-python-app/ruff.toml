target-version = "py311"
line-length = 120
src = ["."]

exclude = [
    ".pytest_cache",
    "__pycache__",
    "temp_images",
    "byteplus_results",
    "byteplus_color_results",
    # ручные скрипты для отладки API, не pytest
    "test/image.py",
    "test/image2.py",
    "test/video.py",
    "test/video2.py",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
    "B904",
    "SIM108",
]

[lint.isort]
known-first-party = ["models", "routers", "services", "middleware"]

[lint.per-file-ignores]
"test/**" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
