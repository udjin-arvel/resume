# RadarArt-Proxy Docker Compose Production конфигурация
#
# Kafka на другом сервере: в .env.prod задайте KAFKA_BOOTSTRAP_SERVERS=host:9092
# (host должен совпадать с advertised listener на брокере).
#
# Использование:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down

services:
  radar-art-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-art-proxy
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env.prod
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - DEBUG=False
    volumes:
      - .:/app
      - ./.env.prod:/app/.env.prod:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
