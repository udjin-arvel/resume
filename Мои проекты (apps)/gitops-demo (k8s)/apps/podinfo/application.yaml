apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: arvelov-gitops-demo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/stefanprodan/charts
    chart: podinfo
    targetRevision: 6.17.0
    helm:
      releaseName: podinfo 
      valuesObject:
        replicaCount: 1
        # image:
        #   tag: "not-exist-some-666" # Несуществующий тег, чтобы запустить приложение с ошибкой
        ui:
          message: arvelov-gitops-demo
          color: "#313131"
          logo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 150'><circle cx='75' cy='75' r='73' fill='%23111' stroke='%23eee' stroke-width='2'/><path d='M43 108 75 40 107 108M57 80h36' fill='none' stroke='%23eee' stroke-width='5'/><path d='m94 49-39 65' stroke='%23111' stroke-width='6'/></svg>" 
        # Чарт podinfo: случайная ошибка примерно на каждый третий запрос.
        # Переключателей в UI нет. Постоянный HTTP 500 — только POST /fault_injection/enable.
        # faults:
        #   error: true
        service:
          type: NodePort
          nodePort: 30080
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
