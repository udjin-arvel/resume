apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: arvelov-gitops-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Отдельный чарт: CRD лежат в templates, не в charts/*/crds/.
    # Тогда ServerSideApply применяется как к обычным манифестам.
    # Git-тег монорепы helm-charts Argo на Kind часто не резолвит (репозиторий слишком большой).
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 9.0.0
    helm:
      valuesObject:
        crds:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
