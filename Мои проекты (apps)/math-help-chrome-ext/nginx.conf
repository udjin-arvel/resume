events {}

http {
  ##
  # 1. DNS Docker‑daemon’а: всегда отдаёт свежий IP контейнера
  ##
  resolver 127.0.0.11 valid=10s ipv6=off;

  ##
  # 2. HTTPS‑виртуал
  ##
  server {
    listen      443 ssl http2;
    server_name example.com example.com;

    ssl_certificate     /etc/ssl/certs/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ## 3. Базовые заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    ## 4. Отсекаем мусорные сканы (cgi, wp‑путь, setup.cgi и т.п.)
    location ~* /(setup|shell|passwd|cgi|wp-|xmlrpc|ads\\.txt|app-ads\\.txt) {
      return 403;
    }

    ## 5. «Пустой» корень и фавиконку отвечаем 204
    location = /            { return 204; }
    location = /favicon.ico { return 204; }

    ## 6. Всё остальное – прямо к Nest на 5555
    location / {
      proxy_pass         http://math-help-api:5555;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }
  }

  ##
  # 3. HTTP‑порт: жёсткий редирект на HTTPS
  ##
  server {
    listen      80;
    server_name example.com example.com;
    return 301  https://$host$request_uri;
  }
}
