limit_req_zone $binary_remote_addr zone=polyglot_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream client_ssr {
  server 127.0.0.1:3000;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 16k;
  limit_req zone=polyglot_per_ip burst=20 nodelay;
  limit_conn conn_per_ip 20;

  access_log /var/log/nginx/polyglot.access.log;
  error_log /var/log/nginx/polyglot.error.log warn;

  location /api/go/ {
    proxy_pass http://backend-go:8081/;
  }
  location /api/node/ {
    proxy_pass http://backend-node:8082/;
  }
  location /api/php/ {
    proxy_pass http://backend-php-nginx:8083/;
  }
  location /api/python/ {
    proxy_pass http://backend-python:8084/;
  }

  location / {
    proxy_pass http://client_ssr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
