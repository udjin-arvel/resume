services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: polyglot
      POSTGRES_PASSWORD: polyglot
      POSTGRES_DB: polyglot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - polyglot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyglot -d polyglot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    mem_limit: 2g
    cpus: 2.0

  backend-go:
    build:
      context: ./backends/go
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: polyglot
      DB_USER: polyglot
      DB_PASSWORD: polyglot
      DB_POOL_SIZE: "20"
      PORT: "8081"
      LOG_LEVEL: warn
    ports:
      - "8081:8081"
    networks:
      - polyglot-net
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 10s
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0

  backend-node:
    build:
      context: ./backends/node
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: polyglot
      DB_USER: polyglot
      DB_PASSWORD: polyglot
      DB_POOL_SIZE: "20"
      PORT: "8082"
      LOG_LEVEL: warn
    ports:
      - "8082:8082"
    networks:
      - polyglot-net
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 10s
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0

  backend-php:
    build:
      context: ./backends/php
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: polyglot
      DB_USER: polyglot
      DB_PASSWORD: polyglot
      DB_POOL_SIZE: "20"
      LOG_LEVEL: warn
    networks:
      - polyglot-net
    depends_on:
      pg:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0

  backend-php-nginx:
    build:
      context: ./backends/php
      dockerfile: nginx.Dockerfile
    ports:
      - "8083:8083"
    networks:
      - polyglot-net
    depends_on:
      - backend-php
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0

  backend-python:
    build:
      context: ./backends/python
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: polyglot
      DB_USER: polyglot
      DB_PASSWORD: polyglot
      DB_POOL_SIZE: "20"
      PORT: "8084"
      LOG_LEVEL: warn
    ports:
      - "8084:8084"
    networks:
      - polyglot-net
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 10s
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0

  client:
    build:
      context: ./client
    ports:
      - "8080:8080"
    networks:
      - polyglot-net
    depends_on:
      backend-go:
        condition: service_healthy
      backend-node:
        condition: service_healthy
      backend-php-nginx:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    mem_limit: 256m
    cpus: 0.5

  bench:
    profiles:
      - bench
    build:
      context: ./bench
    volumes:
      - ./bench/scenarios:/bench/scenarios:ro
      - ./bench/results:/bench/results
      - ./scripts:/scripts:ro
      - .:/repo:ro
    networks:
      - polyglot-net
    environment:
      BENCH_QUICK: ${BENCH_QUICK:-0}
    depends_on:
      backend-go:
        condition: service_healthy
      backend-node:
        condition: service_healthy
      backend-php-nginx:
        condition: service_healthy
      backend-python:
        condition: service_healthy

  adminer:
    profiles:
      - tools
    image: adminer:4
    ports:
      - "8088:8080"
    networks:
      - polyglot-net
    depends_on:
      pg:
        condition: service_healthy

volumes:
  pgdata:

networks:
  polyglot-net:
    driver: bridge
