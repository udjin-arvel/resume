openapi: 3.0.3
info:
  title: Polyglot Backend Benchmark API
  version: 1.0.0
  description: Общий контракт для Go, Node.js, PHP и Python бэкендов.
servers:
  - url: http://localhost:8081
    description: Go (local)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness (optional readiness with db=1)
      parameters:
        - name: db
          in: query
          schema:
            type: integer
            enum: [1]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /items:
    get:
      operationId: listItems
      summary: List items with pagination, filter, search, sort
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_at
              - "-created_at"
              - price
              - "-price"
            default: "-created_at"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createItem
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getItem
      summary: Get one item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateItem
      summary: Full update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteItem
      summary: Delete item
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /stats:
    get:
      operationId: getStats
      summary: Aggregate stats per category
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Item:
      type: object
      required: [id, title, price, category, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
        price:
          type: string
          example: "12.50"
        category:
          type: string
        created_at:
          type: string
          format: date-time
    ItemInput:
      type: object
      required: [title, price, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        price:
          type: string
          example: "12.50"
        category:
          type: string
    ItemsPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Stat:
      type: object
      required: [category, count, avg_price]
      properties:
        category:
          type: string
        count:
          type: integer
        avg_price:
          type: string
    StatsResponse:
      type: object
      required: [stats]
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/Stat"
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - not_found
                - validation_error
                - internal_error
            message:
              type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
