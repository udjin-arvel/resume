# Fluent Bit: приём логов от Docker (logging driver fluentd) → OpenSearch.
# Подходит для Docker Desktop (Windows), где чтение /var/lib/docker/containers в Filebeat часто не работает.

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224

# Docker fluentd driver шлёт записи с тегом вида radar-art-proxy — оставляем как есть.

[OUTPUT]
    Name                es
    Match               *
    Host                opensearch
    Port                9200
    Index               radar-proxy-logs
    Suppress_Type_Name  On
    Trace_Error         On
    tls                 Off
