services:
  postgres:
    image: postgres:15
    container_name: thebook-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thebook}
      POSTGRES_USER: ${POSTGRES_USER:-thebook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thebook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thebook_user} -d ${POSTGRES_DB:-thebook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thebook-server
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-thebook_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thebook}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thebook-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  thebook-network:
    driver: bridge
