services:
  postgres:
    image: postgres:15-alpine
    container_name: radar-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: radar-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - with-redis

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: radar-crm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_dev}@postgres:5432/${POSTGRES_DB:-crm}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      MANAGER_INVITE_SECRET: ${MANAGER_INVITE_SECRET:-}
      WORKER_INVITE_SECRET: ${WORKER_INVITE_SECRET:-}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - api-uploads:/app/uploads

volumes:
  pgdata:
  go-mod-cache:
  api-uploads:
